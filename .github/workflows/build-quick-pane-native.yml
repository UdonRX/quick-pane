name: Build Quick Pane native prototype

on:
  push:
    branches:
      - ios-native-prototype
    paths:
      - "ios-prototype/**"
      - ".github/workflows/build-quick-pane-native.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ios-prototype/**"
      - ".github/workflows/build-quick-pane-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios-prototype/project.yml

      - name: Build for physical iPhone (unsigned)
        run: |
          xcodebuild \
            -project ios-prototype/QuickPaneNative.xcodeproj \
            -scheme QuickPaneNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-prototype/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="ios-prototype/build/Build/Products/Release-iphoneos/QuickPaneNative.app"
          test -d "$APP_PATH"
          mkdir -p ios-prototype/package/Payload
          cp -R "$APP_PATH" ios-prototype/package/Payload/
          cd ios-prototype/package
          ditto -c -k --sequesterRsrc --keepParent Payload QuickPaneNative-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickPaneNative-unsigned-ipa
          path: ios-prototype/package/QuickPaneNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
