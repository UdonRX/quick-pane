<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#1c1c1e;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:16px;
}

.button-area{
  width:100%;
  max-width:360px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  padding:12px;

  background:#2c2c2e;

  border-radius:20px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.35);
}

.quick-button{
  min-height:72px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:#3a3a3c;

  color:#fff;

  text-decoration:none;

  font-size:15px;
  font-weight:600;

  user-select:none;
  -webkit-user-select:none;

  transition:
    transform .12s ease,
    background .15s ease;
}

.quick-button:active{
  transform:scale(.95);
  background:#48484a;
}

.button-content{
  display:flex;
  align-items:center;
  justify-content:center;
}

@media(max-width:360px){

  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .button-area{
    padding:10px;
    gap:7px;
  }

  .quick-button{
    min-height:64px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="button-area">

    <a
      class="quick-button"
      href="shortcuts://run-shortcut?name=Quick%20Silence">
      <span class="button-content">
        Silence
      </span>
    </a>

    <a
      class="quick-button"
      href="shortcuts://run-shortcut?name=Quick%20Workout">
      <span class="button-content">
        Workout
      </span>
    </a>

    <a
      class="quick-button"
      href="shortcuts://run-shortcut?name=Quick%20News">
      <span class="button-content">
        News
      </span>
    </a>

    <a
      class="quick-button"
      href="shortcuts://run-shortcut?name=Quick%20Cokeon">
      <span class="button-content">
        Coke on
      </span>
    </a>

  </div>

</div>

</body>
</html>
